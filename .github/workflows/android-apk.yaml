name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omni-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Omni Calculator for Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # This repository intentionally does not require a committed lockfile.
      # Do not enable setup-node's npm cache: it requires package-lock.json.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Pin command-line tools to revision 20.0, matching the runner image
      # that produced the original sdkmanager mismatch.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Verify build environment
        run: |
          set -euo pipefail
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          test -f src/native-bridge.js
          node --version
          npm --version
          java -version
          sdkmanager --version
          adb version

      - name: Install dependencies and create deterministic lockfile
        run: |
          set -euo pipefail
          npm config set fetch-retries 5
          npm config set fetch-timeout 120000
          npm install --no-audit --no-fund --prefer-online
          test -s package-lock.json
          npm ci --no-audit --no-fund

      - name: Validate and build web application
        run: |
          set -euo pipefail
          node --check www/app.js
          node --check src/native-bridge.js
          npm run build
          test -s www/native-bridge.js

      - name: Create clean Android project
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          test -f android/gradlew
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts

      - name: Generate Android launcher and splash assets
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android

      - name: Verify Android project configuration
        run: |
          set -euo pipefail
          test -f android/gradle/wrapper/gradle-wrapper.properties
          grep -R "com.omni.calculator" android/app/build.gradle* android/app/src/main/AndroidManifest.xml || true

      - name: Build installable debug APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Verify APK and generate checksum
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" > "$APK.sha256"
          unzip -t "$APK" >/dev/null

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Omni-Calculator-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
